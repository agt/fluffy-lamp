apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-toleration-injector
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gpu-toleration-injector
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gpu-toleration-injector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gpu-toleration-injector
subjects:
  - kind: ServiceAccount
    name: gpu-toleration-injector
    namespace: kube-system
